   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ff8c91" x="709.112727" y="450.428" transform="rotate(-0 709.112727 450.428)">completed entropy words</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #95a6c3" x="42.894545" y="472.7965" transform="rotate(-0 42.894545 472.7965)">Free memory slots: output read first, then queued entropy write.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #59dde0" x="120.676364" y="135.403759" transform="rotate(-0 120.676364 135.403759)">Pixel staging</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ebf2ff" x="120.676364" y="168.925844" transform="rotate(-0 120.676364 168.925844)">8 raster bytes → one word</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffcd72" x="435.185455" y="122.621759" transform="rotate(-0 435.185455 122.621759)">Shared single-port memory</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(394.48565 147.175367)">1,360 × 64 bits</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(341.741197 165.593844)">128 pixel words + 1,232 ring words</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9ce6b0" x="797.04" y="135.403759" transform="rotate(-0 797.04 135.403759)">Output register</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ebf2ff" x="797.04" y="168.925844" transform="rotate(-0 797.04 168.925844)">prefetch → MSB-first bytes</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #59dde0" x="120.676364" y="320.742759" transform="rotate(-0 120.676364 320.742759)">ROW transform</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(54.694528 344.814844)">four results per row word</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(63.419371 363.714844)">five arithmetic stages</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #baacff" x="330.349091" y="320.742759" transform="rotate(-0 330.349091 320.742759)">COL + quantization</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(263.380419 345.832031)">interleaved accumulation</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(273.93538 363.714844)">two signed roundings</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9ce6b0" x="540.021818" y="320.742759" transform="rotate(-0 540.021818 320.742759)">Coefficient buffer</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(500.46799 345.832031)">260 stored bits</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(484.740138 363.714844)">reuse by live interval</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ff8c91" x="776.749091" y="320.742759" transform="rotate(-0 776.749091 320.742759)">Entropy + word FIFO</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(709.396513 344.814844)">zigzag → Huffman → pack</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ebf2ff" transform="translate(711.334091 363.714844)">two queued 64-bit words</text>
   </g>
